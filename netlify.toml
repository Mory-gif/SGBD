# Netlify sert l'interface (dossier public/).
# - Options 1 et 2 : l'API est sur Render, la fonction ci-dessous n'est pas utilisée.
# - Option 3 « Netlify seul » : l'API tourne dans netlify/functions/api.mjs (route /api/*).
[build]
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["pg"]
